# Example config for Cartesian XE kinematics
# Tento config je pro tiskárnu s rotujícím extruderem
# - X osa má dva motory (stepper_x a stepper_xe)
# - Rozdíl pozic X motorů otáčí extruderem
# - Filament je tlačen rotačním mechanismem

# ⚠️ DŮLEŽITÁ OMEZENÍ:
# 1. E pozice se automaticky resetuje na 0 při X homingu
# 2. Multi-extruder (T0, T1) není podporován
# 3. NEPOUŽÍVAT hold_current - motory musí být vždy aktivní
# 4. rotation_ratio by měl být mezi 0.1 a 10.0
# 5. Pressure advance smooth_time doporučeno max 0.100

[printer]
kinematics: cartesian_xe
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

# MCU
[mcu]
serial: /dev/serial/by-id/usb-1a86_USB2.0-Serial-if00-port0

# Standardní X motor (stepper_x)
# Pozice = X (bez E komponenty)
[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 0
position_max: 200
homing_speed: 50
# ⚠️ NEPOUŽÍVAT hold_current! Motory musí být vždy aktivní
# hold_current: 0.5  ← ZAKÁZÁNO!

# XE motor (stepper_xe) - kombinuje X a E
# Pozice = X - rotation_ratio * E
[stepper_xe]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40  # ⚠️ Měl by být STEJNÝ jako stepper_x!

# rotation_ratio: Kolik mm X pohybu na 1mm extruze způsobí rotaci
# Příklad: Pokud 1mm extruze = 10° rotace a průměr mechanismu je 20mm:
#   obvod = π * 20 = 62.83mm
#   10° = 10/360 * 62.83 = 1.745mm
#   rotation_ratio = 1.745
# Rozsah: 0.1 - 10.0 (validováno)
rotation_ratio: 1.0

# stepper_xe nemá endstop - bude použit endstop z stepper_x
# ⚠️ NEPOUŽÍVAT hold_current! Motor musí být vždy aktivní
# hold_current: 0.5  ← ZAKÁZÁNO!

# Y osa (normální)
[stepper_y]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_max: 200
homing_speed: 50

# Z osa (normální)
[stepper_z]
step_pin: PB7
dir_pin: PB6
enable_pin: !PB8
microsteps: 16
rotation_distance: 8
endstop_pin: ^PC2
position_endstop: 0
position_max: 200
homing_speed: 5

# Extruder - MUSÍ mít definovaný stepper pro PA výpočty!
# Filament je tlačen rotujícím mechanismem řízeným X motory
# ⚠️ DŮLEŽITÉ: step_pin, dir_pin, enable_pin MUSÍ být definovány!
# Použij dummy piny které nejsou fyzicky připojené
[extruder]
# Tyto piny MUSÍ být definovány (i když se fyzicky nepoužívají!)
# NELZE vynechat! Cartesian XE vyžaduje extruder stepper pro PA.
step_pin: PA1  # Dummy pin - nebude generovat kroky
dir_pin: PA2   # Dummy pin
enable_pin: PA3  # Dummy pin

# Microsteps a rotation_distance jsou potřeba pro PA výpočty
microsteps: 16
rotation_distance: 33.5  # Standardní pro Bowden

# Pressure advance nastavení
# ⚠️ Pro cartesian_xe použij NIŽŠÍ smooth_time než obvykle!
# pressure_advance: 0.05
# pressure_advance_smooth_time: 0.040  # MAX 0.100 doporučeno!
# Nastavení hotend heateru
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 250
# Kinematické parametry
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 100
# POZOR: max_extrude_cross_section může být vyšší kvůli rotačnímu mechanismu
max_extrude_cross_section: 5

[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC3
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

[fan]
pin: PC6

